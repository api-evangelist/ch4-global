name: Ch4 Global
description: >-
  CH4 Global is a climate-technology company working to reduce methane emissions from
  livestock at gigatonne scale. Its flagship product, Methane Tamer, is a feed supplement
  made from Asparagopsis red seaweed that has been shown to cut enteric methane emissions
  in cattle by up to 90 percent. In January 2025 the company began production at what it
  describes as the world's first commercial-scale Asparagopsis growing facility, its EcoPark
  in Louth Bay, South Australia, using a proprietary pond-based cultivation system to lower
  production costs. CH4 Global is a deep-tech and agriculture-focused company backed by DCVC;
  it operates as a physical-product and climate-impact business rather than a software or API
  provider. This profile was added to the API Evangelist network as a portfolio-company lead
  and enriched with the identity and domain-security signals that are publicly available.
